[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.15.0"
anyhow = "1.0.104"
argon2 = "0.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.13", features = ["chrono", "postgres", "r2d2"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
openssl = "0.10.81"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
