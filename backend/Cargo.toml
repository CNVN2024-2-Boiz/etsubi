[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.2"
actix-web = "4.15.0"
anyhow = "1.0.104"
argon2 = "0.5.0"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.3.13", features = ["chrono", "postgres", "r2d2", "uuid"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rstest = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["actix_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["actix-web"] }
uuid = { version = "1.28.0", features = ["serde"] }
