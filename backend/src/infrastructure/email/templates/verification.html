<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Xác thực tài khoản Etsubi</title>
  </head>
  <body
    style="
      font-family: sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    "
  >
    <h1>Chào mừng bạn đến với Etsubi!</h1>
    <p>
      Cảm ơn bạn đã đăng ký. Nhấn vào nút bên dưới để xác thực địa chỉ email:
    </p>
    <p style="text-align: center; margin: 30px 0">
      <a
        href="{{link}}"
        style="
          background: #0066cc;
          color: white;
          padding: 12px 24px;
          text-decoration: none;
          border-radius: 6px;
          display: inline-block;
        "
      >
        Xác thực Email
      </a>
    </p>
    <p style="color: #666; font-size: 14px">
      Hoặc copy liên kết này vào trình duyệt:<br />
      <code>{{link}}</code>
    </p>
    <p style="color: #666; font-size: 14px">
      Liên kết sẽ hết hạn sau 24 giờ. Nếu bạn không đăng ký tài khoản, vui lòng
      bỏ qua email này.
    </p>
  </body>
</html>
