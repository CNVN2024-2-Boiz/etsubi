name: etsubi

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-etsubi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${DATABASE_NAME:-etsubi}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DATABASE_PORT:-11342}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-etsubi} -d ${DATABASE_NAME:-etsubi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [etsubi]

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 11432
      DATABASE_URL: postgres://${DATABASE_USER:-etsubi}:${DATABASE_PASSWORD:-secret}@postgres:5432/${DATABASE_NAME:-etsubi}
      JWT_KEY: ${JWT_KEY:-change-me-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:12321,http://127.0.0.1:12321,http://localhost:22321,http://127.0.0.1:22321}
    ports:
      - "21432:11432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11432/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 6
    networks: [etsubi]

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE: http://localhost:21432/api/v1
    restart: unless-stopped
    ports:
      - "22321:12321"
    depends_on:
      backend:
        condition: service_healthy            
    networks: [etsubi]

volumes:
  postgres_data:
networks:
  etsubi:
