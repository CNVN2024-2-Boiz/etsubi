<!DOCTYPE html>
<html lang="vi">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Etsubi</title>
    <link rel="stylesheet" href="/styles/main.css"/>

</head>
<body>

    <header id="header">
        <img src="/public/logo.svg" alt="Etsubi_logo">
        <span>Etsubi</span>
        <a href="#">Trang chủ</a>
        <a href="#">Diễn đàn</a>
        <a href="#">Về chúng tôi</a>
        <a href="#">Liên hệ</a>
        <button type="button" class="lang-btn">VI</button>
    </header>

    <form id="register_form">
        <h1>Đăng ký</h1>
        <h2>Tạo tài khoản mới để bắt đầu</h2>

        <div>
            <label for="username">Họ và tên</label>
            <input type="text" id="username" placeholder="Nguyễn Văn A" required />
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
        </div>

        <div>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" required />
        </div>

        <div>
            <label for="confirm_password">Xác nhận mật khẩu</label>
            <input type="password" id="confirm_password" required />
        </div>

        <div>
            <input type="checkbox" id="terms" required />
            <label for="terms">Tôi đồng ý với
                <a href="#">Điều khoản sử dụng</a>
            </label>
        </div>

        <div>
            <button type="submit">Đăng ký</button>
        </div>

        <p id="msg"></p>

        <div class="divider">
            <span>hoặc</span>
        </div>

        <div>
            <button type="button" class="btn-google">
                <span>G</span>
                Đăng ký với Google
            </button>
        </div>

        <div class="login_redirect">
            <p>Đã có tài khoản? <a id="login" href="/pages/profile/login.html">Đăng nhập</a></p>
        </div>

    </form>

    <footer id="footer">
        © 2025 Etsubi • 越日 | IE104 — UIT | Cầu nối văn hoá Việt — Nhật
    </footer>

    <script type="module">
        import { request } from '/services/api/client.js';

        const form = document.getElementById('register_form');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.textContent = '';

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (password !== confirm) {
                msg.textContent = 'Mật khẩu xác nhận không khớp.';
                return;
            }

            try {
                await request('/auth/register', {
                    method: 'POST',
                    body: {
                        username: document.getElementById('username').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password,
                    },
                });
                window.location.href = '/pages/profile/login.html';
            } catch (err) {
                msg.textContent = err.message;
            }
        });
    </script>

</body>
</html>
